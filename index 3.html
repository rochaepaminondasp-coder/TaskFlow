<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskFlow — Gestão de Tarefas & Pagamentos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e2e2e8; font-family: 'DM Sans', 'Segoe UI', sans-serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  select option { background: #1a1a2e; color: #e2e2e8; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.3s ease-out; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo, useCallback } = React;
const {
  PieChart, Pie, Cell,
  BarChart, Bar,
  AreaChart, Area,
  XAxis, YAxis, Tooltip,
  ResponsiveContainer
} = Recharts;

const STORAGE_KEYS = { tasks: "tf_tasks", clients: "tf_clients", payments: "tf_payments" };

const URGENCY = {
  alta:  { label: "Alta",  color: "#ef4444", bg: "rgba(239,68,68,0.12)", border: "rgba(239,68,68,0.3)" },
  media: { label: "Média", color: "#f59e0b", bg: "rgba(245,158,11,0.12)", border: "rgba(245,158,11,0.3)" },
  baixa: { label: "Baixa", color: "#22c55e", bg: "rgba(34,197,94,0.12)",  border: "rgba(34,197,94,0.3)" },
};

const CATEGORIES = ["Profissional", "Pessoal"];
const MONTHS = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

const genId    = () => Math.random().toString(36).substr(2, 9);
const getToday = () => new Date().toISOString().split("T")[0];
const fmtDate  = (d) => { const p = d.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; };

function load(key, fb) { try { const d = localStorage.getItem(key); return d ? JSON.parse(d) : fb; } catch { return fb; } }
function save(key, d) { localStorage.setItem(key, JSON.stringify(d)); }

const defaultClients = [{ id: genId(), name: "Freelance Geral", color: "#6366f1" }];

/* ───────── styles ───────── */
const S = {
  app:        { fontFamily: "'DM Sans','Segoe UI',sans-serif", background: "#0a0a0f", color: "#e2e2e8", minHeight: "100vh", maxWidth: 1200, margin: "0 auto", padding: "0 16px 40px" },
  header:     { display:"flex", alignItems:"center", justifyContent:"space-between", padding:"24px 0 16px", borderBottom:"1px solid rgba(255,255,255,0.06)", flexWrap:"wrap", gap:12 },
  logo:       { fontSize:22, fontWeight:800, letterSpacing:"-0.5px", background:"linear-gradient(135deg,#818cf8,#c084fc)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" },
  tabs:       { display:"flex", gap:4, background:"rgba(255,255,255,0.04)", borderRadius:12, padding:4, flexWrap:"wrap" },
  tab:        (a) => ({ padding:"10px 20px", borderRadius:10, border:"none", cursor:"pointer", fontSize:13, fontWeight:600, background:a?"rgba(129,140,248,0.2)":"transparent", color:a?"#a5b4fc":"#888", fontFamily:"inherit", transition:"all .2s" }),
  grid:       { display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))", gap:12, margin:"20px 0" },
  card:       { background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:16, padding:20, position:"relative", overflow:"hidden" },
  accent:     (c) => ({ position:"absolute", top:0, left:0, right:0, height:3, background:"linear-gradient(90deg,"+c+",transparent)" }),
  bigNum:     { fontSize:32, fontWeight:800, letterSpacing:"-1px", margin:"8px 0 4px" },
  smallLabel: { fontSize:12, color:"#888", textTransform:"uppercase", letterSpacing:"1px", fontWeight:600 },
  filterBar:  { display:"flex", gap:8, margin:"16px 0", flexWrap:"wrap", alignItems:"center" },
  sel:        { background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:10, padding:"8px 14px", color:"#e2e2e8", fontSize:13, outline:"none", cursor:"pointer", minWidth:120, fontFamily:"inherit" },
  btn: (v) => ({
    padding: v==="sm"?"6px 14px":"10px 20px", borderRadius:10, border:"none", cursor:"pointer",
    fontSize:13, fontWeight:600, fontFamily:"inherit", transition:"all .2s",
    background: v==="primary"?"linear-gradient(135deg,#6366f1,#8b5cf6)": v==="danger"?"rgba(239,68,68,0.15)":"rgba(255,255,255,0.06)",
    color: v==="primary"?"#fff": v==="danger"?"#ef4444":"#ccc",
  }),
  taskRow: (done, u) => ({
    background: done?"rgba(255,255,255,0.02)":(URGENCY[u]?.bg||"rgba(255,255,255,0.03)"),
    border: "1px solid "+(done?"rgba(255,255,255,0.04)":(URGENCY[u]?.border||"rgba(255,255,255,0.08)")),
    borderRadius:14, padding:16, marginBottom:8, opacity:done?0.6:1,
    borderLeft:"4px solid "+(done?"#444":(URGENCY[u]?.color||"#666")), transition:"all .3s",
  }),
  chk: (done) => ({
    width:22, height:22, borderRadius:7, border:"2px solid "+(done?"#22c55e":"#555"),
    background:done?"#22c55e":"transparent", cursor:"pointer", display:"flex",
    alignItems:"center", justifyContent:"center", flexShrink:0, transition:"all .2s",
  }),
  overlay:   { position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", backdropFilter:"blur(8px)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1000, padding:16 },
  modal:     { background:"#14141f", border:"1px solid rgba(255,255,255,0.08)", borderRadius:20, padding:28, width:"100%", maxWidth:500, maxHeight:"85vh", overflowY:"auto" },
  inp:       { width:"100%", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:10, padding:"10px 14px", color:"#e2e2e8", fontSize:14, outline:"none", boxSizing:"border-box", fontFamily:"inherit" },
  lbl:       { display:"block", fontSize:12, color:"#888", marginBottom:6, fontWeight:600, textTransform:"uppercase", letterSpacing:"0.5px" },
  badge:     (c) => ({ display:"inline-block", padding:"3px 10px", borderRadius:6, fontSize:11, fontWeight:700, background:c+"22", color:c }),
  payBtn: (st) => ({
    padding:"5px 14px", borderRadius:8, fontSize:12, fontWeight:700, border:"none", cursor:"pointer", fontFamily:"inherit",
    background: st==="pago"?"rgba(34,197,94,0.15)": st==="atrasado"?"rgba(239,68,68,0.15)":"rgba(245,158,11,0.15)",
    color: st==="pago"?"#22c55e": st==="atrasado"?"#ef4444":"#f59e0b",
  }),
  chartBox: { background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:16, padding:20 },
  ttStyle:  { background:"#1a1a2e", border:"1px solid rgba(255,255,255,0.1)", borderRadius:10, fontSize:12 },
};

/* ───────── reusable ui ───────── */
function Modal({ onClose, title, children }) {
  return (
    <div style={S.overlay} onClick={onClose}>
      <div className="fade-in" style={S.modal} onClick={e=>e.stopPropagation()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
          <h3 style={{ margin:0, fontSize:18, fontWeight:700 }}>{title}</h3>
          <button onClick={onClose} style={{...S.btn(), width:32, height:32, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", padding:0}}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return <div style={{ marginBottom:14 }}><label style={S.lbl}>{label}</label>{children}</div>;
}

/* ═══════════ MAIN APP ═══════════ */
function App() {
  const [tab, setTab]                   = useState("tarefas");
  const [tasks, setTasks]               = useState(() => load(STORAGE_KEYS.tasks, []));
  const [clients, setClients]           = useState(() => load(STORAGE_KEYS.clients, defaultClients));
  const [payments, setPayments]         = useState(() => load(STORAGE_KEYS.payments, []));
  const [fClient, setFClient]           = useState("all");
  const [fCat, setFCat]                 = useState("all");
  const [fUrg, setFUrg]                 = useState("all");
  const [showHist, setShowHist]         = useState(false);
  const [showAddTask, setShowAddTask]   = useState(false);
  const [showAddCli, setShowAddCli]     = useState(false);
  const [showAddPay, setShowAddPay]     = useState(false);
  const [editing, setEditing]           = useState(null);
  const [nt, setNt] = useState({ title:"", client:"", category:"Profissional", urgency:"media", date:getToday(), description:"" });
  const [nc, setNc] = useState({ name:"", color:"#6366f1" });
  const [np, setNp] = useState({ clientId:"", value:"", dueDate:getToday(), description:"" });

  useEffect(() => save(STORAGE_KEYS.tasks, tasks), [tasks]);
  useEffect(() => save(STORAGE_KEYS.clients, clients), [clients]);
  useEffect(() => save(STORAGE_KEYS.payments, payments), [payments]);

  /* actions */
  const addTask = () => {
    if (!nt.title.trim()) return;
    setTasks(p => [{ ...nt, id:genId(), done:false, createdAt:new Date().toISOString(), completedAt:null }, ...p]);
    setNt({ title:"", client:"", category:"Profissional", urgency:"media", date:getToday(), description:"" });
    setShowAddTask(false);
  };
  const saveEdit   = () => { if (!editing) return; setTasks(p => p.map(t => t.id===editing.id ? editing : t)); setEditing(null); };
  const toggle     = (id) => setTasks(p => p.map(t => t.id===id ? {...t, done:!t.done, completedAt:!t.done?new Date().toISOString():null} : t));
  const delTask    = (id) => setTasks(p => p.filter(t => t.id!==id));
  const addClient  = () => { if (!nc.name.trim()) return; setClients(p => [...p,{...nc,id:genId()}]); setNc({name:"",color:"#6366f1"}); setShowAddCli(false); };
  const delClient  = (id) => setClients(p => p.filter(c => c.id!==id));
  const addPayment = () => { if (!np.clientId||!np.value) return; setPayments(p => [...p,{...np,id:genId(),value:parseFloat(np.value),status:"pendente",createdAt:new Date().toISOString()}]); setNp({clientId:"",value:"",dueDate:getToday(),description:""}); setShowAddPay(false); };
  const setPaySt   = (id,st) => setPayments(p => p.map(x => x.id===id ? {...x, status:st, paidAt:st==="pago"?new Date().toISOString():null} : x));
  const delPay     = (id) => setPayments(p => p.filter(x => x.id!==id));

  const cName  = (id) => clients.find(c=>c.id===id)?.name || "—";
  const cColor = (id) => clients.find(c=>c.id===id)?.color || "#666";

  /* computed */
  const filtered = useMemo(() => tasks.filter(t => {
    if (fClient!=="all" && t.client!==fClient) return false;
    if (fCat!=="all" && t.category!==fCat) return false;
    if (fUrg!=="all" && t.urgency!==fUrg) return false;
    if (!showHist && t.done) return false;
    return true;
  }).sort((a,b)=>{
    if (a.done!==b.done) return a.done?1:-1;
    const u={alta:0,media:1,baixa:2}; return (u[a.urgency]||1)-(u[b.urgency]||1);
  }), [tasks,fClient,fCat,fUrg,showHist]);

  const todayT   = tasks.filter(t=>t.date===getToday());
  const todayD   = todayT.filter(t=>t.done).length;
  const pending  = tasks.filter(t=>!t.done).length;
  const done     = tasks.filter(t=>t.done).length;
  const rate     = tasks.length ? Math.round((done/tasks.length)*100)+"%" : "0%";

  const urgData = Object.entries(URGENCY).map(([k,v])=>({name:v.label,value:tasks.filter(t=>!t.done&&t.urgency===k).length,color:v.color})).filter(d=>d.value>0);
  const catData = CATEGORIES.map(c=>({name:c, pendentes:tasks.filter(t=>!t.done&&t.category===c).length, concluidas:tasks.filter(t=>t.done&&t.category===c).length}));

  const last7 = useMemo(()=>{
    const d=[];
    for(let i=6;i>=0;i--){ const dt=new Date(); dt.setDate(dt.getDate()-i); const ds=dt.toISOString().split("T")[0];
      d.push({name:dt.getDate()+"/"+(dt.getMonth()+1), concluidas:tasks.filter(t=>t.done&&t.completedAt&&t.completedAt.startsWith(ds)).length, criadas:tasks.filter(t=>t.createdAt&&t.createdAt.startsWith(ds)).length});
    } return d;
  },[tasks]);

  const cm = new Date().getMonth(), cy = new Date().getFullYear();
  const mPay = payments.filter(p=>{const d=new Date(p.dueDate); return d.getMonth()===cm&&d.getFullYear()===cy;});
  const totRec  = mPay.filter(p=>p.status==="pago").reduce((s,p)=>s+p.value,0);
  const totPend = mPay.filter(p=>p.status==="pendente").reduce((s,p)=>s+p.value,0);
  const totOver = mPay.filter(p=>p.status==="atrasado").reduce((s,p)=>s+p.value,0);
  const payByCli = useMemo(()=>{
    const m={}; mPay.forEach(p=>{if(!m[p.clientId])m[p.clientId]={pago:0,pendente:0,atrasado:0}; m[p.clientId][p.status]+=p.value;});
    return Object.entries(m).map(([id,v])=>({name:cName(id),...v}));
  },[mPay,clients]);

  const fmtBRL = (v) => "R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2});

  /* ─────── TASK FORM (shared) ─────── */
  const TaskForm = ({data, set, onSave, label}) => (
    <>
      <Field label="Título"><input style={S.inp} value={data.title} onChange={e=>set(p=>({...p,title:e.target.value}))} placeholder="Ex: Criar landing page" /></Field>
      <Field label="Descrição"><input style={S.inp} value={data.description} onChange={e=>set(p=>({...p,description:e.target.value}))} placeholder="Detalhes opcionais..." /></Field>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Field label="Cliente"><select style={{...S.inp,cursor:"pointer"}} value={data.client} onChange={e=>set(p=>({...p,client:e.target.value}))}><option value="">Sem cliente</option>{clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
        <Field label="Categoria"><select style={{...S.inp,cursor:"pointer"}} value={data.category} onChange={e=>set(p=>({...p,category:e.target.value}))}>{CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>
        <Field label="Urgência"><select style={{...S.inp,cursor:"pointer"}} value={data.urgency} onChange={e=>set(p=>({...p,urgency:e.target.value}))}>{Object.entries(URGENCY).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select></Field>
        <Field label="Data"><input type="date" style={S.inp} value={data.date} onChange={e=>set(p=>({...p,date:e.target.value}))} /></Field>
      </div>
      <button style={{...S.btn("primary"),width:"100%",marginTop:8}} onClick={onSave}>{label}</button>
    </>
  );

  /* ═══════════ RENDER ═══════════ */
  return (
    <div style={S.app}>
      {/* HEADER */}
      <div style={S.header}>
        <div style={S.logo}>⚡ TaskFlow</div>
        <div style={S.tabs}>
          {[["tarefas","📋 Tarefas"],["desempenho","📊 Desempenho"],["pagamentos","💰 Pagamentos"],["clientes","👥 Clientes"]].map(([k,l])=>(
            <button key={k} style={S.tab(tab===k)} onClick={()=>setTab(k)}>{l}</button>
          ))}
        </div>
      </div>

      {/* ════════ TAREFAS ════════ */}
      {tab==="tarefas" && <div className="fade-in">
        <div style={S.grid}>
          {[{l:"Hoje",v:todayD+"/"+todayT.length,c:"#818cf8",s:"tarefas do dia"},{l:"Pendentes",v:pending,c:"#f59e0b",s:"aguardando"},{l:"Concluídas",v:done,c:"#22c55e",s:"finalizadas"},{l:"Taxa",v:rate,c:"#c084fc",s:"de conclusão"}].map((x,i)=>(
            <div key={i} style={S.card}><div style={S.accent(x.c)}/><div style={S.smallLabel}>{x.l}</div><div style={{...S.bigNum,color:x.c}}>{x.v}</div><div style={{fontSize:11,color:"#666"}}>{x.s}</div></div>
          ))}
        </div>
        <div style={S.filterBar}>
          <select style={S.sel} value={fClient} onChange={e=>setFClient(e.target.value)}><option value="all">Todos os clientes</option>{clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
          <select style={S.sel} value={fCat} onChange={e=>setFCat(e.target.value)}><option value="all">Todas categorias</option>{CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select>
          <select style={S.sel} value={fUrg} onChange={e=>setFUrg(e.target.value)}><option value="all">Todas urgências</option>{Object.entries(URGENCY).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:"#888",cursor:"pointer"}}><input type="checkbox" checked={showHist} onChange={e=>setShowHist(e.target.checked)} style={{accentColor:"#818cf8"}} /> Histórico</label>
          <div style={{flex:1}} />
          <button style={S.btn("primary")} onClick={()=>setShowAddTask(true)}>+ Nova Tarefa</button>
        </div>

        {filtered.length===0 && <div style={{textAlign:"center",padding:60,color:"#555"}}><div style={{fontSize:40,marginBottom:12}}>🎯</div><div style={{fontSize:15,fontWeight:600}}>Nenhuma tarefa encontrada</div><div style={{fontSize:13,marginTop:6}}>Adicione uma nova tarefa para começar!</div></div>}

        {filtered.map(t=>(
          <div key={t.id} style={S.taskRow(t.done,t.urgency)}>
            <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
              <div style={S.chk(t.done)} onClick={()=>toggle(t.id)}>{t.done && <span style={{color:"#fff",fontSize:13,fontWeight:800}}>✓</span>}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <span style={{fontSize:15,fontWeight:600,textDecoration:t.done?"line-through":"none",color:t.done?"#666":"#e2e2e8"}}>{t.title}</span>
                  <span style={S.badge(URGENCY[t.urgency]?.color||"#888")}>{URGENCY[t.urgency]?.label}</span>
                  <span style={S.badge("#818cf8")}>{t.category}</span>
                </div>
                {t.description && <div style={{fontSize:12,color:"#777",marginTop:4}}>{t.description}</div>}
                <div style={{display:"flex",gap:12,marginTop:8,fontSize:11,color:"#666",flexWrap:"wrap"}}>
                  {t.client && <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,borderRadius:"50%",background:cColor(t.client),display:"inline-block"}} />{cName(t.client)}</span>}
                  <span>📅 {fmtDate(t.date)}</span>
                  {t.done && t.completedAt && <span>✅ {fmtDate(t.completedAt.split("T")[0])}</span>}
                </div>
              </div>
              <div style={{display:"flex",gap:4}}>
                <button style={{...S.btn("sm"),padding:"4px 8px"}} onClick={()=>setEditing({...t})}>✏️</button>
                <button style={{...S.btn("sm"),padding:"4px 8px",background:"rgba(239,68,68,0.1)",color:"#ef4444"}} onClick={()=>delTask(t.id)}>🗑️</button>
              </div>
            </div>
          </div>
        ))}
      </div>}

      {/* ════════ DESEMPENHO ════════ */}
      {tab==="desempenho" && <div className="fade-in">
        <h2 style={{fontSize:20,fontWeight:700,margin:"24px 0 16px"}}>📊 Seu Desempenho</h2>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:16}}>
          <div style={S.chartBox}>
            <h4 style={{margin:"0 0 16px",fontSize:14,color:"#aaa",fontWeight:600}}>Últimos 7 dias</h4>
            <ResponsiveContainer width="100%" height={220}>
              <AreaChart data={last7}>
                <defs>
                  <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#22c55e" stopOpacity={0.3}/><stop offset="100%" stopColor="#22c55e" stopOpacity={0}/></linearGradient>
                  <linearGradient id="gR" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#818cf8" stopOpacity={0.3}/><stop offset="100%" stopColor="#818cf8" stopOpacity={0}/></linearGradient>
                </defs>
                <XAxis dataKey="name" tick={{fill:"#666",fontSize:11}} axisLine={false} tickLine={false}/>
                <YAxis tick={{fill:"#666",fontSize:11}} axisLine={false} tickLine={false} allowDecimals={false}/>
                <Tooltip contentStyle={S.ttStyle}/>
                <Area type="monotone" dataKey="concluidas" stroke="#22c55e" fill="url(#gC)" strokeWidth={2} name="Concluídas"/>
                <Area type="monotone" dataKey="criadas" stroke="#818cf8" fill="url(#gR)" strokeWidth={2} name="Criadas"/>
              </AreaChart>
            </ResponsiveContainer>
          </div>

          <div style={S.chartBox}>
            <h4 style={{margin:"0 0 16px",fontSize:14,color:"#aaa",fontWeight:600}}>Pendentes por Urgência</h4>
            {urgData.length>0 ? (
              <ResponsiveContainer width="100%" height={220}>
                <PieChart><Pie data={urgData} cx="50%" cy="50%" innerRadius={55} outerRadius={85} dataKey="value" paddingAngle={4} strokeWidth={0}>{urgData.map((d,i)=><Cell key={i} fill={d.color}/>)}</Pie><Tooltip contentStyle={S.ttStyle}/></PieChart>
              </ResponsiveContainer>
            ) : <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:220,color:"#555",fontSize:14}}>Nenhuma tarefa pendente 🎉</div>}
            <div style={{display:"flex",justifyContent:"center",gap:16,marginTop:8}}>{urgData.map((d,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:12}}><div style={{width:10,height:10,borderRadius:3,background:d.color}}/><span style={{color:"#aaa"}}>{d.name}: {d.value}</span></div>))}</div>
          </div>

          <div style={S.chartBox}>
            <h4 style={{margin:"0 0 16px",fontSize:14,color:"#aaa",fontWeight:600}}>Por Categoria</h4>
            <ResponsiveContainer width="100%" height={220}>
              <BarChart data={catData} barGap={4}><XAxis dataKey="name" tick={{fill:"#666",fontSize:11}} axisLine={false} tickLine={false}/><YAxis tick={{fill:"#666",fontSize:11}} axisLine={false} tickLine={false} allowDecimals={false}/><Tooltip contentStyle={S.ttStyle}/><Bar dataKey="pendentes" fill="#f59e0b" radius={[6,6,0,0]} name="Pendentes"/><Bar dataKey="concluidas" fill="#22c55e" radius={[6,6,0,0]} name="Concluídas"/></BarChart>
            </ResponsiveContainer>
          </div>

          <div style={S.chartBox}>
            <h4 style={{margin:"0 0 16px",fontSize:14,color:"#aaa",fontWeight:600}}>Por Cliente</h4>
            <ResponsiveContainer width="100%" height={220}>
              <BarChart data={clients.map(c=>({name:c.name.length>12?c.name.slice(0,12)+"…":c.name, pendentes:tasks.filter(t=>!t.done&&t.client===c.id).length, concluidas:tasks.filter(t=>t.done&&t.client===c.id).length}))} barGap={4}><XAxis dataKey="name" tick={{fill:"#666",fontSize:10}} axisLine={false} tickLine={false}/><YAxis tick={{fill:"#666",fontSize:11}} axisLine={false} tickLine={false} allowDecimals={false}/><Tooltip contentStyle={S.ttStyle}/><Bar dataKey="pendentes" fill="#818cf8" radius={[6,6,0,0]} name="Pendentes"/><Bar dataKey="concluidas" fill="#c084fc" radius={[6,6,0,0]} name="Concluídas"/></BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>}

      {/* ════════ PAGAMENTOS ════════ */}
      {tab==="pagamentos" && <div className="fade-in">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"24px 0 16px",flexWrap:"wrap",gap:12}}>
          <h2 style={{fontSize:20,fontWeight:700,margin:0}}>💰 Pagamentos — {MONTHS[cm]}/{cy}</h2>
          <button style={S.btn("primary")} onClick={()=>setShowAddPay(true)}>+ Novo Pagamento</button>
        </div>
        <div style={S.grid}>
          {[{l:"Recebido",v:fmtBRL(totRec),c:"#22c55e"},{l:"Pendente",v:fmtBRL(totPend),c:"#f59e0b"},{l:"Atrasado",v:fmtBRL(totOver),c:"#ef4444"}].map((x,i)=>(
            <div key={i} style={S.card}><div style={S.accent(x.c)}/><div style={S.smallLabel}>{x.l}</div><div style={{...S.bigNum,color:x.c,fontSize:26}}>{x.v}</div></div>
          ))}
        </div>

        {payByCli.length>0 && <div style={{...S.chartBox,marginBottom:16}}>
          <h4 style={{margin:"0 0 16px",fontSize:14,color:"#aaa",fontWeight:600}}>Pagamentos por Cliente</h4>
          <ResponsiveContainer width="100%" height={200}>
            <BarChart data={payByCli} layout="vertical" barGap={2}><XAxis type="number" tick={{fill:"#666",fontSize:11}} axisLine={false} tickLine={false}/><YAxis type="category" dataKey="name" tick={{fill:"#aaa",fontSize:12}} axisLine={false} tickLine={false} width={100}/><Tooltip contentStyle={S.ttStyle} formatter={v=>"R$ "+v.toFixed(2)}/><Bar dataKey="pago" fill="#22c55e" stackId="a" name="Pago"/><Bar dataKey="pendente" fill="#f59e0b" stackId="a" name="Pendente"/><Bar dataKey="atrasado" fill="#ef4444" stackId="a" radius={[0,6,6,0]} name="Atrasado"/></BarChart>
          </ResponsiveContainer>
        </div>}

        {mPay.length===0 && <div style={{textAlign:"center",padding:60,color:"#555"}}><div style={{fontSize:40,marginBottom:12}}>💸</div><div style={{fontSize:15,fontWeight:600}}>Nenhum pagamento registrado</div></div>}

        {mPay.sort((a,b)=>{const o={atrasado:0,pendente:1,pago:2};return (o[a.status]??1)-(o[b.status]??1);}).map(p=>(
          <div key={p.id} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:14,padding:16,marginBottom:8,borderLeft:"4px solid "+(p.status==="pago"?"#22c55e":p.status==="atrasado"?"#ef4444":"#f59e0b")}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><span style={{width:10,height:10,borderRadius:"50%",background:cColor(p.clientId),display:"inline-block"}}/><span style={{fontSize:15,fontWeight:600}}>{cName(p.clientId)}</span></div>
                {p.description && <div style={{fontSize:12,color:"#777"}}>{p.description}</div>}
                <div style={{fontSize:12,color:"#666",marginTop:4}}>Vencimento: {fmtDate(p.dueDate)}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                <span style={{fontSize:20,fontWeight:800,color:p.status==="pago"?"#22c55e":"#e2e2e8"}}>{fmtBRL(p.value)}</span>
                <div style={{display:"flex",gap:4}}>
                  {["pago","pendente","atrasado"].map(st=><button key={st} style={S.payBtn(st===p.status?st:"none")} onClick={()=>setPaySt(p.id,st)}>{st==="pago"?"✅":st==="pendente"?"⏳":"🔴"}</button>)}
                  <button style={{...S.btn("sm"),padding:"4px 8px",background:"rgba(239,68,68,0.1)",color:"#ef4444"}} onClick={()=>delPay(p.id)}>🗑️</button>
                </div>
              </div>
            </div>
          </div>
        ))}
      </div>}

      {/* ════════ CLIENTES ════════ */}
      {tab==="clientes" && <div className="fade-in">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"24px 0 16px"}}>
          <h2 style={{fontSize:20,fontWeight:700,margin:0}}>👥 Clientes & Empresas</h2>
          <button style={S.btn("primary")} onClick={()=>setShowAddCli(true)}>+ Novo Cliente</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:12}}>
          {clients.map(c=>{
            const ct=tasks.filter(t=>t.client===c.id), cd=ct.filter(t=>t.done).length;
            const cp=payments.filter(p=>p.clientId===c.id&&p.status==="pago").reduce((s,p)=>s+p.value,0);
            return (
              <div key={c.id} style={{...S.card,borderTop:"4px solid "+c.color}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:36,height:36,borderRadius:10,background:c.color+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:800,color:c.color}}>{c.name[0]?.toUpperCase()}</div>
                    <span style={{fontSize:16,fontWeight:700}}>{c.name}</span>
                  </div>
                  <button style={{...S.btn("sm"),padding:"4px 8px",background:"rgba(239,68,68,0.1)",color:"#ef4444"}} onClick={()=>delClient(c.id)}>🗑️</button>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                  <div style={{background:"rgba(255,255,255,0.04)",borderRadius:10,padding:"10px 12px"}}><div style={{fontSize:11,color:"#888"}}>Tarefas</div><div style={{fontSize:18,fontWeight:700,color:"#818cf8"}}>{cd}/{ct.length}</div></div>
                  <div style={{background:"rgba(255,255,255,0.04)",borderRadius:10,padding:"10px 12px"}}><div style={{fontSize:11,color:"#888"}}>Recebido</div><div style={{fontSize:14,fontWeight:700,color:"#22c55e"}}>{fmtBRL(cp)}</div></div>
                </div>
              </div>
            );
          })}
        </div>
      </div>}

      {/* ════════ MODAIS ════════ */}
      {showAddTask && <Modal onClose={()=>setShowAddTask(false)} title="Nova Tarefa"><TaskForm data={nt} set={setNt} onSave={addTask} label="Adicionar Tarefa"/></Modal>}

      {editing && <Modal onClose={()=>setEditing(null)} title="Editar Tarefa"><TaskForm data={editing} set={setEditing} onSave={saveEdit} label="Salvar Alterações"/></Modal>}

      {showAddCli && <Modal onClose={()=>setShowAddCli(false)} title="Novo Cliente">
        <Field label="Nome do Cliente/Empresa"><input style={S.inp} value={nc.name} onChange={e=>setNc(p=>({...p,name:e.target.value}))} placeholder="Ex: Empresa XYZ"/></Field>
        <Field label="Cor"><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{["#6366f1","#8b5cf6","#ec4899","#ef4444","#f59e0b","#22c55e","#06b6d4","#3b82f6","#f97316","#14b8a6"].map(c=><div key={c} onClick={()=>setNc(p=>({...p,color:c}))} style={{width:32,height:32,borderRadius:8,background:c,cursor:"pointer",border:nc.color===c?"3px solid #fff":"3px solid transparent",transition:"all .2s"}}/>)}</div></Field>
        <button style={{...S.btn("primary"),width:"100%",marginTop:8}} onClick={addClient}>Adicionar Cliente</button>
      </Modal>}

      {showAddPay && <Modal onClose={()=>setShowAddPay(false)} title="Novo Pagamento">
        <Field label="Cliente"><select style={{...S.inp,cursor:"pointer"}} value={np.clientId} onChange={e=>setNp(p=>({...p,clientId:e.target.value}))}><option value="">Selecione um cliente</option>{clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
        <Field label="Valor (R$)"><input type="number" style={S.inp} value={np.value} onChange={e=>setNp(p=>({...p,value:e.target.value}))} placeholder="0.00" step="0.01"/></Field>
        <Field label="Descrição"><input style={S.inp} value={np.description} onChange={e=>setNp(p=>({...p,description:e.target.value}))} placeholder="Ex: Projeto website"/></Field>
        <Field label="Data de Vencimento"><input type="date" style={S.inp} value={np.dueDate} onChange={e=>setNp(p=>({...p,dueDate:e.target.value}))}/></Field>
        <button style={{...S.btn("primary"),width:"100%",marginTop:8}} onClick={addPayment}>Registrar Pagamento</button>
      </Modal>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
