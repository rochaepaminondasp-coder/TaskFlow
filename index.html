<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskFlow — Gestão de Tarefas & Pagamentos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.15.3/Recharts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e2e2e8; font-family: 'DM Sans', 'Segoe UI', sans-serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  select option { background: #1a1a2e; color: #e2e2e8; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const { PieChart, Pie, Cell, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, AreaChart, Area } = Recharts;

const STORAGE_KEYS = { tasks: "tf_tasks", clients: "tf_clients", payments: "tf_payments" };

const URGENCY = {
  alta: { label: "Alta", color: "#ef4444", bg: "rgba(239,68,68,0.12)", border: "rgba(239,68,68,0.3)" },
  media: { label: "Média", color: "#f59e0b", bg: "rgba(245,158,11,0.12)", border: "rgba(245,158,11,0.3)" },
  baixa: { label: "Baixa", color: "#22c55e", bg: "rgba(34,197,94,0.12)", border: "rgba(34,197,94,0.3)" },
};

const CATEGORIES = ["Profissional", "Pessoal"];
const MONTHS = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

const genId = () => Math.random().toString(36).substr(2, 9);
const today = () => new Date().toISOString().split("T")[0];
const formatDate = (d) => { const p = d.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; };

function loadData(key, fallback) {
  try { const d = localStorage.getItem(key); return d ? JSON.parse(d) : fallback; } catch { return fallback; }
}
function saveData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

const defaultClients = [{ id: genId(), name: "Freelance Geral", color: "#6366f1" }];

function TaskFlowApp() {
  const [tab, setTab] = useState("tarefas");
  const [tasks, setTasks] = useState(() => loadData(STORAGE_KEYS.tasks, []));
  const [clients, setClients] = useState(() => loadData(STORAGE_KEYS.clients, defaultClients));
  const [payments, setPayments] = useState(() => loadData(STORAGE_KEYS.payments, []));
  const [filterClient, setFilterClient] = useState("all");
  const [filterCategory, setFilterCategory] = useState("all");
  const [filterUrgency, setFilterUrgency] = useState("all");
  const [showHistory, setShowHistory] = useState(false);
  const [showAddTask, setShowAddTask] = useState(false);
  const [showAddClient, setShowAddClient] = useState(false);
  const [showAddPayment, setShowAddPayment] = useState(false);
  const [editingTask, setEditingTask] = useState(null);
  const [newTask, setNewTask] = useState({ title: "", client: "", category: "Profissional", urgency: "media", date: today(), description: "" });
  const [newClient, setNewClient] = useState({ name: "", color: "#6366f1" });
  const [newPayment, setNewPayment] = useState({ clientId: "", value: "", dueDate: today(), description: "" });

  useEffect(() => saveData(STORAGE_KEYS.tasks, tasks), [tasks]);
  useEffect(() => saveData(STORAGE_KEYS.clients, clients), [clients]);
  useEffect(() => saveData(STORAGE_KEYS.payments, payments), [payments]);

  const addTask = () => {
    if (!newTask.title.trim()) return;
    const task = { ...newTask, id: genId(), done: false, createdAt: new Date().toISOString(), completedAt: null };
    setTasks(prev => [task, ...prev]);
    setNewTask({ title: "", client: "", category: "Profissional", urgency: "media", date: today(), description: "" });
    setShowAddTask(false);
  };

  const updateTask = () => {
    if (!editingTask) return;
    setTasks(prev => prev.map(t => t.id === editingTask.id ? editingTask : t));
    setEditingTask(null);
  };

  const toggleTask = (id) => {
    setTasks(prev => prev.map(t => t.id === id ? { ...t, done: !t.done, completedAt: !t.done ? new Date().toISOString() : null } : t));
  };

  const deleteTask = (id) => setTasks(prev => prev.filter(t => t.id !== id));

  const addClient = () => {
    if (!newClient.name.trim()) return;
    setClients(prev => [...prev, { ...newClient, id: genId() }]);
    setNewClient({ name: "", color: "#6366f1" });
    setShowAddClient(false);
  };

  const deleteClient = (id) => setClients(prev => prev.filter(c => c.id !== id));

  const addPayment = () => {
    if (!newPayment.clientId || !newPayment.value) return;
    setPayments(prev => [...prev, { ...newPayment, id: genId(), value: parseFloat(newPayment.value), status: "pendente", createdAt: new Date().toISOString() }]);
    setNewPayment({ clientId: "", value: "", dueDate: today(), description: "" });
    setShowAddPayment(false);
  };

  const updatePaymentStatus = (id, status) => {
    setPayments(prev => prev.map(p => p.id === id ? { ...p, status, paidAt: status === "pago" ? new Date().toISOString() : null } : p));
  };

  const deletePayment = (id) => setPayments(prev => prev.filter(p => p.id !== id));

  const getClientName = (id) => clients.find(c => c.id === id)?.name || "—";
  const getClientColor = (id) => clients.find(c => c.id === id)?.color || "#666";

  const filteredTasks = useMemo(() => {
    return tasks.filter(t => {
      if (filterClient !== "all" && t.client !== filterClient) return false;
      if (filterCategory !== "all" && t.category !== filterCategory) return false;
      if (filterUrgency !== "all" && t.urgency !== filterUrgency) return false;
      if (!showHistory && t.done) return false;
      return true;
    });
  }, [tasks, filterClient, filterCategory, filterUrgency, showHistory]);

  const todayTasks = tasks.filter(t => t.date === today());
  const todayDone = todayTasks.filter(t => t.done).length;
  const totalPending = tasks.filter(t => !t.done).length;
  const totalDone = tasks.filter(t => t.done).length;

  const urgencyData = Object.entries(URGENCY).map(([key, val]) => ({
    name: val.label, value: tasks.filter(t => !t.done && t.urgency === key).length, color: val.color
  })).filter(d => d.value > 0);

  const categoryData = CATEGORIES.map(c => ({
    name: c,
    pendentes: tasks.filter(t => !t.done && t.category === c).length,
    concluidas: tasks.filter(t => t.done && t.category === c).length,
  }));

  const last7 = useMemo(() => {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const ds = d.toISOString().split("T")[0];
      const label = d.getDate()+"/"+(d.getMonth()+1);
      days.push({
        name: label,
        concluidas: tasks.filter(t => t.done && t.completedAt && t.completedAt.split("T")[0] === ds).length,
        criadas: tasks.filter(t => t.createdAt && t.createdAt.split("T")[0] === ds).length,
      });
    }
    return days;
  }, [tasks]);

  const currentMonth = new Date().getMonth();
  const currentYear = new Date().getFullYear();
  const monthPayments = payments.filter(p => {
    const d = new Date(p.dueDate);
    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
  });
  const totalReceived = monthPayments.filter(p => p.status === "pago").reduce((s, p) => s + p.value, 0);
  const totalPendingPay = monthPayments.filter(p => p.status === "pendente").reduce((s, p) => s + p.value, 0);
  const totalOverdue = monthPayments.filter(p => p.status === "atrasado").reduce((s, p) => s + p.value, 0);

  const paymentByClient = useMemo(() => {
    const map = {};
    monthPayments.forEach(p => {
      if (!map[p.clientId]) map[p.clientId] = { pago: 0, pendente: 0, atrasado: 0 };
      map[p.clientId][p.status] += p.value;
    });
    return Object.entries(map).map(([id, vals]) => ({ name: getClientName(id), ...vals }));
  }, [monthPayments, clients]);

  const S = {
    app: { fontFamily: "'DM Sans', 'Segoe UI', sans-serif", background: "#0a0a0f", color: "#e2e2e8", minHeight: "100vh", maxWidth: 1200, margin: "0 auto", padding: "0 16px 40px" },
    header: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "24px 0 16px", borderBottom: "1px solid rgba(255,255,255,0.06)", flexWrap: "wrap", gap: 12 },
    logo: { fontSize: 22, fontWeight: 800, letterSpacing: "-0.5px", background: "linear-gradient(135deg, #818cf8, #c084fc)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" },
    tabs: { display: "flex", gap: 4, background: "rgba(255,255,255,0.04)", borderRadius: 12, padding: 4, flexWrap: "wrap" },
    tab: (active) => ({ padding: "10px 20px", borderRadius: 10, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, transition: "all 0.2s", background: active ? "rgba(129,140,248,0.2)" : "transparent", color: active ? "#a5b4fc" : "#888", letterSpacing: "0.3px", fontFamily: "inherit" }),
    grid: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 12, margin: "20px 0" },
    statCard: (accent) => ({ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 16, padding: "20px", position: "relative", overflow: "hidden" }),
    statAccent: (color) => ({ position: "absolute", top: 0, left: 0, right: 0, height: 3, background: "linear-gradient(90deg, "+color+", transparent)" }),
    statValue: { fontSize: 32, fontWeight: 800, letterSpacing: "-1px", margin: "8px 0 4px" },
    statLabel: { fontSize: 12, color: "#888", textTransform: "uppercase", letterSpacing: "1px", fontWeight: 600 },
    filterBar: { display: "flex", gap: 8, margin: "16px 0", flexWrap: "wrap", alignItems: "center" },
    select: { background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, padding: "8px 14px", color: "#e2e2e8", fontSize: 13, outline: "none", cursor: "pointer", minWidth: 120, fontFamily: "inherit" },
    btn: (variant) => ({
      padding: variant === "sm" ? "6px 14px" : "10px 20px",
      borderRadius: 10, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, transition: "all 0.2s", fontFamily: "inherit",
      background: variant === "primary" ? "linear-gradient(135deg, #6366f1, #8b5cf6)" : variant === "danger" ? "rgba(239,68,68,0.15)" : "rgba(255,255,255,0.06)",
      color: variant === "primary" ? "#fff" : variant === "danger" ? "#ef4444" : "#ccc",
    }),
    taskItem: (done, urgency) => ({
      background: done ? "rgba(255,255,255,0.02)" : (URGENCY[urgency]?.bg || "rgba(255,255,255,0.03)"),
      border: "1px solid "+(done ? "rgba(255,255,255,0.04)" : (URGENCY[urgency]?.border || "rgba(255,255,255,0.08)")),
      borderRadius: 14, padding: "16px", marginBottom: 8, transition: "all 0.3s", opacity: done ? 0.6 : 1,
      borderLeft: "4px solid "+(done ? "#444" : (URGENCY[urgency]?.color || "#666")),
    }),
    checkbox: (done) => ({
      width: 22, height: 22, borderRadius: 7, border: "2px solid "+(done ? "#22c55e" : "#555"),
      background: done ? "#22c55e" : "transparent", cursor: "pointer", display: "flex", alignItems: "center",
      justifyContent: "center", flexShrink: 0, transition: "all 0.2s",
    }),
    modal: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", backdropFilter: "blur(8px)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 16 },
    modalContent: { background: "#14141f", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 20, padding: 28, width: "100%", maxWidth: 500, maxHeight: "85vh", overflowY: "auto" },
    input: { width: "100%", background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, padding: "10px 14px", color: "#e2e2e8", fontSize: 14, outline: "none", boxSizing: "border-box", fontFamily: "inherit" },
    label: { display: "block", fontSize: 12, color: "#888", marginBottom: 6, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.5px" },
    badge: (color) => ({ display: "inline-block", padding: "3px 10px", borderRadius: 6, fontSize: 11, fontWeight: 700, background: color+"22", color: color, letterSpacing: "0.5px" }),
    payStatus: (status) => ({
      padding: "5px 14px", borderRadius: 8, fontSize: 12, fontWeight: 700, border: "none", cursor: "pointer", fontFamily: "inherit",
      background: status === "pago" ? "rgba(34,197,94,0.15)" : status === "atrasado" ? "rgba(239,68,68,0.15)" : "rgba(245,158,11,0.15)",
      color: status === "pago" ? "#22c55e" : status === "atrasado" ? "#ef4444" : "#f59e0b",
    }),
    chartBox: { background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 16, padding: 20 },
  };

  const Modal = ({ onClose, title, children }) => (
    <div style={S.modal} onClick={onClose}>
      <div style={S.modalContent} onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <h3 style={{ margin: 0, fontSize: 18, fontWeight: 700 }}>{title}</h3>
          <button onClick={onClose} style={{ ...S.btn(), width: 32, height: 32, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );

  const Field = ({ label, children }) => (
    <div style={{ marginBottom: 14 }}><label style={S.label}>{label}</label>{children}</div>
  );

  return (
    <div style={S.app}>
      {/* Header */}
      <div style={S.header}>
        <div style={S.logo}>⚡ TaskFlow</div>
        <div style={S.tabs}>
          {[["tarefas","📋 Tarefas"],["desempenho","📊 Desempenho"],["pagamentos","💰 Pagamentos"],["clientes","👥 Clientes"]].map(([k,l]) => (
            <button key={k} style={S.tab(tab===k)} onClick={() => setTab(k)}>{l}</button>
          ))}
        </div>
      </div>

      {/* TAREFAS */}
      {tab === "tarefas" && (
        <div>
          <div style={S.grid}>
            {[
              { label: "Hoje", value: todayDone+"/"+todayTasks.length, color: "#818cf8", sub: "tarefas do dia" },
              { label: "Pendentes", value: totalPending, color: "#f59e0b", sub: "aguardando" },
              { label: "Concluídas", value: totalDone, color: "#22c55e", sub: "finalizadas" },
              { label: "Taxa", value: tasks.length ? Math.round((totalDone / tasks.length) * 100)+"%" : "0%", color: "#c084fc", sub: "de conclusão" },
            ].map((s, i) => (
              <div key={i} style={S.statCard(s.color)}>
                <div style={S.statAccent(s.color)} />
                <div style={S.statLabel}>{s.label}</div>
                <div style={{ ...S.statValue, color: s.color }}>{s.value}</div>
                <div style={{ fontSize: 11, color: "#666" }}>{s.sub}</div>
              </div>
            ))}
          </div>

          <div style={S.filterBar}>
            <select style={S.select} value={filterClient} onChange={e => setFilterClient(e.target.value)}>
              <option value="all">Todos os clientes</option>
              {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <select style={S.select} value={filterCategory} onChange={e => setFilterCategory(e.target.value)}>
              <option value="all">Todas categorias</option>
              {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <select style={S.select} value={filterUrgency} onChange={e => setFilterUrgency(e.target.value)}>
              <option value="all">Todas urgências</option>
              {Object.entries(URGENCY).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
            <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: "#888", cursor: "pointer" }}>
              <input type="checkbox" checked={showHistory} onChange={e => setShowHistory(e.target.checked)} style={{ accentColor: "#818cf8" }} /> Histórico
            </label>
            <div style={{ flex: 1 }} />
            <button style={S.btn("primary")} onClick={() => setShowAddTask(true)}>+ Nova Tarefa</button>
          </div>

          <div>
            {filteredTasks.length === 0 && (
              <div style={{ textAlign: "center", padding: 60, color: "#555" }}>
                <div style={{ fontSize: 40, marginBottom: 12 }}>🎯</div>
                <div style={{ fontSize: 15, fontWeight: 600 }}>Nenhuma tarefa encontrada</div>
                <div style={{ fontSize: 13, marginTop: 6 }}>Adicione uma nova tarefa para começar!</div>
              </div>
            )}
            {filteredTasks.sort((a,b) => {
              if (a.done !== b.done) return a.done ? 1 : -1;
              const urg = { alta: 0, media: 1, baixa: 2 };
              return (urg[a.urgency] || 1) - (urg[b.urgency] || 1);
            }).map(task => (
              <div key={task.id} style={S.taskItem(task.done, task.urgency)}>
                <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
                  <div style={S.checkbox(task.done)} onClick={() => toggleTask(task.id)}>
                    {task.done && <span style={{ color: "#fff", fontSize: 13, fontWeight: 800 }}>✓</span>}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 15, fontWeight: 600, textDecoration: task.done ? "line-through" : "none", color: task.done ? "#666" : "#e2e2e8" }}>
                        {task.title}
                      </span>
                      <span style={S.badge(URGENCY[task.urgency]?.color || "#888")}>{URGENCY[task.urgency]?.label}</span>
                      <span style={S.badge("#818cf8")}>{task.category}</span>
                    </div>
                    {task.description && <div style={{ fontSize: 12, color: "#777", marginTop: 4 }}>{task.description}</div>}
                    <div style={{ display: "flex", gap: 12, marginTop: 8, fontSize: 11, color: "#666", flexWrap: "wrap" }}>
                      {task.client && <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
                        <span style={{ width: 8, height: 8, borderRadius: "50%", background: getClientColor(task.client), display: "inline-block" }} />
                        {getClientName(task.client)}
                      </span>}
                      <span>📅 {formatDate(task.date)}</span>
                      {task.done && task.completedAt && <span>✅ Concluída em {formatDate(task.completedAt.split("T")[0])}</span>}
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 4 }}>
                    <button style={{ ...S.btn("sm"), padding: "4px 8px" }} onClick={() => setEditingTask({...task})}>✏️</button>
                    <button style={{ ...S.btn("sm"), padding: "4px 8px", background: "rgba(239,68,68,0.1)", color: "#ef4444" }} onClick={() => deleteTask(task.id)}>🗑️</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* DESEMPENHO */}
      {tab === "desempenho" && (
        <div>
          <h2 style={{ fontSize: 20, fontWeight: 700, margin: "24px 0 16px" }}>📊 Seu Desempenho</h2>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(320px, 1fr))", gap: 16 }}>
            <div style={S.chartBox}>
              <h4 style={{ margin: "0 0 16px", fontSize: 14, color: "#aaa", fontWeight: 600 }}>Últimos 7 dias</h4>
              <ResponsiveContainer width="100%" height={220}>
                <AreaChart data={last7}>
                  <defs>
                    <linearGradient id="gConcl" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="#22c55e" stopOpacity={0.3} />
                      <stop offset="100%" stopColor="#22c55e" stopOpacity={0} />
                    </linearGradient>
                    <linearGradient id="gCriadas" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="#818cf8" stopOpacity={0.3} />
                      <stop offset="100%" stopColor="#818cf8" stopOpacity={0} />
                    </linearGradient>
                  </defs>
                  <XAxis dataKey="name" tick={{ fill: "#666", fontSize: 11 }} axisLine={false} tickLine={false} />
                  <YAxis tick={{ fill: "#666", fontSize: 11 }} axisLine={false} tickLine={false} allowDecimals={false} />
                  <Tooltip contentStyle={{ background: "#1a1a2e", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, fontSize: 12 }} />
                  <Area type="monotone" dataKey="concluidas" stroke="#22c55e" fill="url(#gConcl)" strokeWidth={2} name="Concluídas" />
                  <Area type="monotone" dataKey="criadas" stroke="#818cf8" fill="url(#gCriadas)" strokeWidth={2} name="Criadas" />
                </AreaChart>
              </ResponsiveContainer>
            </div>

            <div style={S.chartBox}>
              <h4 style={{ margin: "0 0 16px", fontSize: 14, color: "#aaa", fontWeight: 600 }}>Pendentes por Urgência</h4>
              {urgencyData.length > 0 ? (
                <ResponsiveContainer width="100%" height={220}>
                  <PieChart>
                    <Pie data={urgencyData} cx="50%" cy="50%" innerRadius={55} outerRadius={85} dataKey="value" paddingAngle={4} strokeWidth={0}>
                      {urgencyData.map((d, i) => <Cell key={i} fill={d.color} />)}
                    </Pie>
                    <Tooltip contentStyle={{ background: "#1a1a2e", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, fontSize: 12 }} />
                  </PieChart>
                </ResponsiveContainer>
              ) : (
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: 220, color: "#555", fontSize: 14 }}>Nenhuma tarefa pendente 🎉</div>
              )}
              <div style={{ display: "flex", justifyContent: "center", gap: 16, marginTop: 8 }}>
                {urgencyData.map((d, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
                    <div style={{ width: 10, height: 10, borderRadius: 3, background: d.color }} />
                    <span style={{ color: "#aaa" }}>{d.name}: {d.value}</span>
                  </div>
                ))}
              </div>
            </div>

            <div style={S.chartBox}>
              <h4 style={{ margin: "0 0 16px", fontSize: 14, color: "#aaa", fontWeight: 600 }}>Por Categoria</h4>
              <ResponsiveContainer width="100%" height={220}>
                <BarChart data={categoryData} barGap={4}>
                  <XAxis dataKey="name" tick={{ fill: "#666", fontSize: 11 }} axisLine={false} tickLine={false} />
                  <YAxis tick={{ fill: "#666", fontSize: 11 }} axisLine={false} tickLine={false} allowDecimals={false} />
                  <Tooltip contentStyle={{ background: "#1a1a2e", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, fontSize: 12 }} />
                  <Bar dataKey="pendentes" fill="#f59e0b" radius={[6,6,0,0]} name="Pendentes" />
                  <Bar dataKey="concluidas" fill="#22c55e" radius={[6,6,0,0]} name="Concluídas" />
                </BarChart>
              </ResponsiveContainer>
            </div>

            <div style={S.chartBox}>
              <h4 style={{ margin: "0 0 16px", fontSize: 14, color: "#aaa", fontWeight: 600 }}>Tarefas por Cliente</h4>
              {clients.length > 0 ? (
                <ResponsiveContainer width="100%" height={220}>
                  <BarChart data={clients.map(c => ({
                    name: c.name.length > 12 ? c.name.slice(0,12)+"…" : c.name,
                    pendentes: tasks.filter(t => !t.done && t.client === c.id).length,
                    concluidas: tasks.filter(t => t.done && t.client === c.id).length,
                  }))} barGap={4}>
                    <XAxis dataKey="name" tick={{ fill: "#666", fontSize: 10 }} axisLine={false} tickLine={false} />
                    <YAxis tick={{ fill: "#666", fontSize: 11 }} axisLine={false} tickLine={false} allowDecimals={false} />
                    <Tooltip contentStyle={{ background: "#1a1a2e", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, fontSize: 12 }} />
                    <Bar dataKey="pendentes" fill="#818cf8" radius={[6,6,0,0]} name="Pendentes" />
                    <Bar dataKey="concluidas" fill="#c084fc" radius={[6,6,0,0]} name="Concluídas" />
                  </BarChart>
                </ResponsiveContainer>
              ) : (
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: 220, color: "#555" }}>Adicione clientes primeiro</div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* PAGAMENTOS */}
      {tab === "pagamentos" && (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "24px 0 16px", flexWrap: "wrap", gap: 12 }}>
            <h2 style={{ fontSize: 20, fontWeight: 700, margin: 0 }}>💰 Pagamentos — {MONTHS[currentMonth]}/{currentYear}</h2>
            <button style={S.btn("primary")} onClick={() => setShowAddPayment(true)}>+ Novo Pagamento</button>
          </div>

          <div style={S.grid}>
            {[
              { label: "Recebido", value: "R$ "+totalReceived.toLocaleString("pt-BR", { minimumFractionDigits: 2 }), color: "#22c55e" },
              { label: "Pendente", value: "R$ "+totalPendingPay.toLocaleString("pt-BR", { minimumFractionDigits: 2 }), color: "#f59e0b" },
              { label: "Atrasado", value: "R$ "+totalOverdue.toLocaleString("pt-BR", { minimumFractionDigits: 2 }), color: "#ef4444" },
            ].map((s, i) => (
              <div key={i} style={S.statCard(s.color)}>
                <div style={S.statAccent(s.color)} />
                <div style={S.statLabel}>{s.label}</div>
                <div style={{ ...S.statValue, color: s.color, fontSize: 26 }}>{s.value}</div>
              </div>
            ))}
          </div>

          {paymentByClient.length > 0 && (
            <div style={{ ...S.chartBox, marginBottom: 16 }}>
              <h4 style={{ margin: "0 0 16px", fontSize: 14, color: "#aaa", fontWeight: 600 }}>Pagamentos por Cliente</h4>
              <ResponsiveContainer width="100%" height={200}>
                <BarChart data={paymentByClient} layout="vertical" barGap={2}>
                  <XAxis type="number" tick={{ fill: "#666", fontSize: 11 }} axisLine={false} tickLine={false} />
                  <YAxis type="category" dataKey="name" tick={{ fill: "#aaa", fontSize: 12 }} axisLine={false} tickLine={false} width={100} />
                  <Tooltip contentStyle={{ background: "#1a1a2e", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, fontSize: 12 }} formatter={(v) => "R$ "+v.toFixed(2)} />
                  <Bar dataKey="pago" fill="#22c55e" stackId="a" radius={[0,0,0,0]} name="Pago" />
                  <Bar dataKey="pendente" fill="#f59e0b" stackId="a" name="Pendente" />
                  <Bar dataKey="atrasado" fill="#ef4444" stackId="a" radius={[0,6,6,0]} name="Atrasado" />
                </BarChart>
              </ResponsiveContainer>
            </div>
          )}

          <div>
            {monthPayments.length === 0 && (
              <div style={{ textAlign: "center", padding: 60, color: "#555" }}>
                <div style={{ fontSize: 40, marginBottom: 12 }}>💸</div>
                <div style={{ fontSize: 15, fontWeight: 600 }}>Nenhum pagamento registrado</div>
                <div style={{ fontSize: 13, marginTop: 6 }}>Adicione pagamentos para controlar suas finanças</div>
              </div>
            )}
            {monthPayments.sort((a,b) => {
              const order = { atrasado: 0, pendente: 1, pago: 2 };
              return (order[a.status] ?? 1) - (order[b.status] ?? 1);
            }).map(p => (
              <div key={p.id} style={{
                background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)",
                borderRadius: 14, padding: "16px", marginBottom: 8,
                borderLeft: "4px solid "+(p.status === "pago" ? "#22c55e" : p.status === "atrasado" ? "#ef4444" : "#f59e0b"),
              }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                  <div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                      <span style={{ width: 10, height: 10, borderRadius: "50%", background: getClientColor(p.clientId), display: "inline-block" }} />
                      <span style={{ fontSize: 15, fontWeight: 600 }}>{getClientName(p.clientId)}</span>
                    </div>
                    {p.description && <div style={{ fontSize: 12, color: "#777" }}>{p.description}</div>}
                    <div style={{ fontSize: 12, color: "#666", marginTop: 4 }}>Vencimento: {formatDate(p.dueDate)}</div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                    <span style={{ fontSize: 20, fontWeight: 800, color: p.status === "pago" ? "#22c55e" : "#e2e2e8" }}>
                      R$ {p.value.toLocaleString("pt-BR", { minimumFractionDigits: 2 })}
                    </span>
                    <div style={{ display: "flex", gap: 4 }}>
                      {["pago", "pendente", "atrasado"].map(st => (
                        <button key={st} style={S.payStatus(st === p.status ? st : "none")} onClick={() => updatePaymentStatus(p.id, st)}
                          title={st.charAt(0).toUpperCase() + st.slice(1)}>
                          {st === "pago" ? "✅" : st === "pendente" ? "⏳" : "🔴"}
                        </button>
                      ))}
                      <button style={{ ...S.btn("sm"), padding: "4px 8px", background: "rgba(239,68,68,0.1)", color: "#ef4444" }} onClick={() => deletePayment(p.id)}>🗑️</button>
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* CLIENTES */}
      {tab === "clientes" && (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "24px 0 16px" }}>
            <h2 style={{ fontSize: 20, fontWeight: 700, margin: 0 }}>👥 Clientes & Empresas</h2>
            <button style={S.btn("primary")} onClick={() => setShowAddClient(true)}>+ Novo Cliente</button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 12 }}>
            {clients.map(c => {
              const cTasks = tasks.filter(t => t.client === c.id);
              const cDone = cTasks.filter(t => t.done).length;
              const cPayments = payments.filter(p => p.clientId === c.id);
              const cPaid = cPayments.filter(p => p.status === "pago").reduce((s,p) => s + p.value, 0);
              return (
                <div key={c.id} style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 16, padding: 20, borderTop: "4px solid "+c.color }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <div style={{ width: 36, height: 36, borderRadius: 10, background: c.color+"33", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, fontWeight: 800, color: c.color }}>
                        {c.name[0]?.toUpperCase()}
                      </div>
                      <span style={{ fontSize: 16, fontWeight: 700 }}>{c.name}</span>
                    </div>
                    <button style={{ ...S.btn("sm"), padding: "4px 8px", background: "rgba(239,68,68,0.1)", color: "#ef4444" }} onClick={() => deleteClient(c.id)}>🗑️</button>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                    <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 10, padding: "10px 12px" }}>
                      <div style={{ fontSize: 11, color: "#888" }}>Tarefas</div>
                      <div style={{ fontSize: 18, fontWeight: 700, color: "#818cf8" }}>{cDone}/{cTasks.length}</div>
                    </div>
                    <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 10, padding: "10px 12px" }}>
                      <div style={{ fontSize: 11, color: "#888" }}>Recebido</div>
                      <div style={{ fontSize: 14, fontWeight: 700, color: "#22c55e" }}>R$ {cPaid.toLocaleString("pt-BR", { minimumFractionDigits: 2 })}</div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* MODAIS */}
      {showAddTask && (
        <Modal onClose={() => setShowAddTask(false)} title="Nova Tarefa">
          <Field label="Título"><input style={S.input} value={newTask.title} onChange={e => setNewTask(p => ({...p, title: e.target.value}))} placeholder="Ex: Criar landing page" /></Field>
          <Field label="Descrição"><input style={S.input} value={newTask.description} onChange={e => setNewTask(p => ({...p, description: e.target.value}))} placeholder="Detalhes opcionais..." /></Field>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Field label="Cliente">
              <select style={{...S.input, cursor:"pointer"}} value={newTask.client} onChange={e => setNewTask(p => ({...p, client: e.target.value}))}>
                <option value="">Sem cliente</option>
                {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </Field>
            <Field label="Categoria">
              <select style={{...S.input, cursor:"pointer"}} value={newTask.category} onChange={e => setNewTask(p => ({...p, category: e.target.value}))}>
                {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Urgência">
              <select style={{...S.input, cursor:"pointer"}} value={newTask.urgency} onChange={e => setNewTask(p => ({...p, urgency: e.target.value}))}>
                {Object.entries(URGENCY).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
              </select>
            </Field>
            <Field label="Data">
              <input type="date" style={S.input} value={newTask.date} onChange={e => setNewTask(p => ({...p, date: e.target.value}))} />
            </Field>
          </div>
          <button style={{ ...S.btn("primary"), width: "100%", marginTop: 8 }} onClick={addTask}>Adicionar Tarefa</button>
        </Modal>
      )}

      {editingTask && (
        <Modal onClose={() => setEditingTask(null)} title="Editar Tarefa">
          <Field label="Título"><input style={S.input} value={editingTask.title} onChange={e => setEditingTask(p => ({...p, title: e.target.value}))} /></Field>
          <Field label="Descrição"><input style={S.input} value={editingTask.description} onChange={e => setEditingTask(p => ({...p, description: e.target.value}))} /></Field>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Field label="Cliente">
              <select style={{...S.input, cursor:"pointer"}} value={editingTask.client} onChange={e => setEditingTask(p => ({...p, client: e.target.value}))}>
                <option value="">Sem cliente</option>
                {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </Field>
            <Field label="Categoria">
              <select style={{...S.input, cursor:"pointer"}} value={editingTask.category} onChange={e => setEditingTask(p => ({...p, category: e.target.value}))}>
                {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Urgência">
              <select style={{...S.input, cursor:"pointer"}} value={editingTask.urgency} onChange={e => setEditingTask(p => ({...p, urgency: e.target.value}))}>
                {Object.entries(URGENCY).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
              </select>
            </Field>
            <Field label="Data">
              <input type="date" style={S.input} value={editingTask.date} onChange={e => setEditingTask(p => ({...p, date: e.target.value}))} />
            </Field>
          </div>
          <button style={{ ...S.btn("primary"), width: "100%", marginTop: 8 }} onClick={updateTask}>Salvar Alterações</button>
        </Modal>
      )}

      {showAddClient && (
        <Modal onClose={() => setShowAddClient(false)} title="Novo Cliente">
          <Field label="Nome do Cliente/Empresa"><input style={S.input} value={newClient.name} onChange={e => setNewClient(p => ({...p, name: e.target.value}))} placeholder="Ex: Empresa XYZ" /></Field>
          <Field label="Cor">
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {["#6366f1","#8b5cf6","#ec4899","#ef4444","#f59e0b","#22c55e","#06b6d4","#3b82f6","#f97316","#14b8a6"].map(c => (
                <div key={c} onClick={() => setNewClient(p => ({...p, color: c}))} style={{
                  width: 32, height: 32, borderRadius: 8, background: c, cursor: "pointer",
                  border: newClient.color === c ? "3px solid #fff" : "3px solid transparent",
                  transition: "all 0.2s",
                }} />
              ))}
            </div>
          </Field>
          <button style={{ ...S.btn("primary"), width: "100%", marginTop: 8 }} onClick={addClient}>Adicionar Cliente</button>
        </Modal>
      )}

      {showAddPayment && (
        <Modal onClose={() => setShowAddPayment(false)} title="Novo Pagamento">
          <Field label="Cliente">
            <select style={{...S.input, cursor:"pointer"}} value={newPayment.clientId} onChange={e => setNewPayment(p => ({...p, clientId: e.target.value}))}>
              <option value="">Selecione um cliente</option>
              {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </Field>
          <Field label="Valor (R$)"><input type="number" style={S.input} value={newPayment.value} onChange={e => setNewPayment(p => ({...p, value: e.target.value}))} placeholder="0.00" step="0.01" /></Field>
          <Field label="Descrição"><input style={S.input} value={newPayment.description} onChange={e => setNewPayment(p => ({...p, description: e.target.value}))} placeholder="Ex: Projeto website" /></Field>
          <Field label="Data de Vencimento"><input type="date" style={S.input} value={newPayment.dueDate} onChange={e => setNewPayment(p => ({...p, dueDate: e.target.value}))} /></Field>
          <button style={{ ...S.btn("primary"), width: "100%", marginTop: 8 }} onClick={addPayment}>Registrar Pagamento</button>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TaskFlowApp />);
</script>
</body>
</html>
